<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что послушать</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1ece2; --text:#1d1b18; --muted:#6c665c; --line:rgba(29,27,24,.25);
  --on-bg:#1d1b18; --on-text:#f1ece2;
  --paper:#e8dcc3; --ink:#1c1a17; --stamp:#a8412b;
  --serif:'Instrument Serif',Georgia,serif; --mono:'Martian Mono',ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0e12; --text:#e9e6df; --muted:#8b877e; --line:rgba(233,230,223,.22);
    --on-bg:#e9e6df; --on-text:#0c0e12;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0e12; --text:#e9e6df; --muted:#8b877e; --line:rgba(233,230,223,.22);
  --on-bg:#e9e6df; --on-text:#0c0e12;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-weight:300;font-size:13px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:44px 22px 56px}
h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(46px,11vw,76px);line-height:.95;margin:0 0 14px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 30px;max-width:46ch}
.group{margin:0 0 18px}
.group p{margin:0 0 8px;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:12px;color:var(--text);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed="true"]{background:var(--on-bg);color:var(--on-text);border-color:var(--on-bg)}
.go{margin:12px 0 34px;font-family:var(--serif);font-style:italic;font-size:30px;color:var(--on-text);background:var(--on-bg);border:0;border-radius:999px;padding:12px 34px 14px;cursor:pointer;transition:transform .15s}
.go:hover{transform:translateY(-2px)}
:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}

/* Билет: главный элемент страницы */
.slot{min-height:210px}
.ticket{position:relative;display:flex;color:var(--ink);background:var(--paper);border-radius:6px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.28));
  -webkit-mask:radial-gradient(circle 11px at 84px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at 84px 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 11px at 84px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at 84px 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket.print{animation:print .9s cubic-bezier(.16,1,.3,1)}
@keyframes print{from{transform:translateY(-34px);opacity:0;clip-path:inset(0 0 100% 0)}to{transform:none;opacity:1;clip-path:inset(0 0 0 0)}}
.stub{width:168px;flex:none;display:flex;align-items:center;justify-content:center;border-right:2px dashed rgba(28,26,23,.35);padding:18px 0;margin:0}
.stub span{font-family:var(--serif);font-style:italic;font-size:34px;color:var(--stamp);transform:rotate(-8deg);border:2px solid var(--stamp);border-radius:6px;padding:0 12px 3px}
.body{padding:24px 24px 22px;flex:1;min-width:0}
.body h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6.2vw,44px);line-height:1;margin:0 0 8px;overflow-wrap:anywhere}
.sub{margin:0 0 16px;color:#5a5348}
.tags{margin:0 0 18px;font-size:12px;color:#5a5348}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts a,.acts button{font:inherit;font-size:12px;color:var(--ink);background:none;border:1px solid rgba(28,26,23,.4);border-radius:999px;padding:5px 13px;cursor:pointer;text-decoration:none}
.acts a:hover,.acts button:hover{background:var(--ink);color:var(--paper)}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:26px 22px;margin:0}
.hist{margin-top:34px;color:var(--muted);font-size:12px}
.hist b{font-weight:400;color:var(--text)}
@media (max-width:520px){
  .ticket{flex-direction:column;-webkit-mask:none;mask:none}
  .stub{width:auto;border-right:0;border-bottom:2px dashed rgba(28,26,23,.35);padding:14px 0}
}
@media (prefers-reduced-motion:reduce){.ticket.print{animation:none}.go,.chip{transition:none}}
</style>
</head>
<body>
<main>
  <h1>что послушать<br>сегодня</h1>
  <p class="lead">Выбери настроение и тип, а сайт вытянет для тебя трек, фильм или аниме на вечер.</p>

  <div class="group"><p>что ищем</p><div class="chips" id="types"></div></div>
  <div class="group"><p>какое настроение</p><div class="chips" id="moods"></div></div>

  <button class="go" id="go">выбрать</button>

  <div class="slot" id="slot" aria-live="polite"></div>
  <p class="hist" id="hist" hidden></p>
</main>

<script>
const T = {m:"музыка", f:"фильм", a:"аниме"};
const M = {sad:"грустное", up:"бодрое", night:"ночное", cozy:"уютное"};
// тип, название, автор или год, настроения
const D = [
 ["m","Glimpse of Us","Joji","sad,night"],
 ["m","Blinding Lights","The Weeknd","up,night"],
 ["m","Chamber of Reflection","Mac DeMarco","night,cozy"],
 ["m","when the party’s over","Billie Eilish","sad,night"],
 ["m","The Less I Know the Better","Tame Impala","up"],
 ["m","Feather","Nujabes","cozy,night"],
 ["m","One Summer’s Day","Joe Hisaishi","cozy,sad"],
 ["m","Apocalypse","Cigarettes After Sex","night,sad"],
 ["m","Do I Wanna Know?","Arctic Monkeys","night"],
 ["m","Video Games","Lana Del Rey","sad"],
 ["m","Roygbiv","Boards of Canada","cozy,night"],
 ["m","One More Time","Daft Punk","up"],
 ["f","Blade Runner 2049","2017","night"],
 ["f","Spirited Away","2001","cozy"],
 ["f","Whiplash","2014","up"],
 ["f","Eternal Sunshine of the Spotless Mind","2004","sad"],
 ["f","Drive","2011","night"],
 ["f","Lost in Translation","2003","night,sad"],
 ["f","Amélie","2001","cozy,up"],
 ["f","Her","2013","sad,night"],
 ["f","Paddington 2","2017","cozy,up"],
 ["f","La La Land","2016","up,sad"],
 ["f","Mad Max: Fury Road","2015","up"],
 ["f","Interstellar","2014","sad,night"],
 ["a","Cowboy Bebop","1998","night,up"],
 ["a","Your Name","2016","sad,cozy"],
 ["a","Mushishi","2005","cozy,night"],
 ["a","Death Note","2006","night"],
 ["a","Haikyu!!","2014","up"],
 ["a","Violet Evergarden","2018","sad"],
 ["a","Samurai Champloo","2004","up,night"],
 ["a","Barakamon","2014","cozy,up"],
 ["a","Serial Experiments Lain","1998","night"],
 ["a","A Silent Voice","2016","sad"],
 ["a","Fullmetal Alchemist: Brotherhood","2009","up"],
 ["a","Spy x Family","2022","cozy,up"]
];

let type = "all", mood = "all", last = -1, hist = [];
try { hist = JSON.parse(localStorage.getItem("wl_hist") || "[]"); } catch (e) { hist = []; }

function chips(box, items, key) {
  const el = document.getElementById(box);
  [["all", key === "type" ? "всё" : "любое"]].concat(Object.entries(items)).forEach(([k, label]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", String(k === "all"));
    b.onclick = () => {
      if (key === "type") type = k; else mood = k;
      el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    };
    el.appendChild(b);
  });
}
chips("types", T, "type");
chips("moods", M, "mood");

function renderHist() {
  const h = document.getElementById("hist");
  h.hidden = !hist.length;
  h.innerHTML = hist.length ? "Недавно выпадало: " + hist.map(x => "<b></b>").join(", ") : "";
  h.querySelectorAll("b").forEach((b, i) => b.textContent = hist[i]);
}

function pick() {
  const pool = [];
  D.forEach((d, i) => {
    if ((type === "all" || d[0] === type) && (mood === "all" || d[3].split(",").includes(mood))) pool.push(i);
  });
  const slot = document.getElementById("slot");
  if (!pool.length) {
    slot.innerHTML = '<p class="empty">С таким сочетанием пока ничего нет. Выбери другое настроение или тип «всё».</p>';
    return;
  }
  let i;
  do { i = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && i === last);
  last = i;
  const [t, title, sub, moods] = D[i];
  const q = encodeURIComponent(title + " " + (t === "m" ? sub + " слушать" : t === "f" ? "фильм " + sub : "аниме " + sub));
  slot.innerHTML = '<article class="ticket print"><div class="stub"><span></span></div><div class="body"><h2></h2><p class="sub"></p><p class="tags"></p><div class="acts"><a target="_blank" rel="noopener">найти</a><button type="button" id="cp">скопировать</button></div></div></article>';
  slot.querySelector(".stub span").textContent = T[t];
  slot.querySelector("h2").textContent = title;
  slot.querySelector(".sub").textContent = sub;
  slot.querySelector(".tags").textContent = moods.split(",").map(m => M[m]).join(", ");
  slot.querySelector("a").href = "https://www.google.com/search?q=" + q;
  const cp = slot.querySelector("#cp");
  cp.onclick = async () => {
    const txt = "Сегодня: " + title + " (" + sub + ")";
    try { await navigator.clipboard.writeText(txt); cp.textContent = "скопировано"; }
    catch (e) { cp.textContent = "не вышло, выдели вручную"; }
    setTimeout(() => cp.textContent = "скопировать", 1800);
  };
  hist = [title].concat(hist.filter(x => x !== title)).slice(0, 5);
  try { localStorage.setItem("wl_hist", JSON.stringify(hist)); } catch (e) {}
  renderHist();
}
document.getElementById("go").onclick = pick;
renderHist();
</script>
</body>
</html>
